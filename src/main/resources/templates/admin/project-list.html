<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>프로젝트 관리</h3>
        <a th:href="@{/admin/projects/new}" class="btn btn-dark">새 프로젝트 등록</a>
    </div>

    <table class="table">
        <thead><tr><th>제목</th><th>연도</th><th>학생</th><th></th></tr></thead>
        <tbody>
        <tr th:each="project : ${projects}">
            <td th:text="${project.title}"></td>
            <td th:text="${project.year}"></td>
            <td th:text="${#strings.listJoin(project.studentNames, ', ')}"></td>
            <td>
                <a th:href="@{'/admin/projects/' + ${project.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">수정</a>
                <form th:action="@{'/admin/projects/' + ${project.id} + '/delete'}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
