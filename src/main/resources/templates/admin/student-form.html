<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-render-mode="static"
      th:attr="data-render-mode='server'">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student != null} ? '학생 수정 | SW 작품전' : '학생 등록 | SW 작품전'">학생 등록 | SW 작품전</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/admin.js" defer></script>
  </head>
  <body class="admin-page" data-page="student-form" id="top">
    <header class="admin-topbar">
      <div class="container admin-topbar-inner">
        <a class="brand" href="/admin/dashboard"><span class="brand-mark">SW</span><span>작품전 관리자</span></a>
        <a class="admin-dashboard-link" href="/admin/dashboard">대시보드로 돌아가기</a>
      </div>
    </header>

    <main class="admin-main">
      <div class="container admin-shell admin-form-shell">
        <section class="admin-page-heading">
          <div>
            <span class="section-kicker" data-student-form-kicker th:text="${student != null} ? 'EDIT STUDENT' : 'REGISTER STUDENT'">REGISTER STUDENT</span>
            <h1 data-student-form-title th:text="${student != null} ? '학생 수정' : '새 학생 등록'">새 학생 등록</h1>
          </div>
          <p>학생 이름과 학과·기수 정보를 입력합니다.<br>등록된 학생은 프로젝트 폼에서 선택할 수 있습니다.</p>
        </section>

        <form class="admin-student-form"
              action="/admin/students"
              th:action="@{${formAction}}"
              method="post">
          <div class="admin-field">
            <label for="studentName">학생 이름</label>
            <input class="form-control"
                   id="studentName"
                   name="name"
                   type="text"
                   maxlength="100"
                   required
                   placeholder="학생 이름을 입력하세요"
                   th:value="${student != null} ? ${student.name} : ''">
          </div>
          <div class="admin-field">
            <label for="studentCohort">학과 및 기수</label>
            <input class="form-control"
                   id="studentCohort"
                   name="cohort"
                   type="text"
                   maxlength="50"
                   required
                   placeholder="학과 및 기수를 입력하세요"
                   th:value="${student != null} ? ${student.cohort} : ''">
          </div>
          <div class="admin-form-actions">
            <a class="admin-back-link" href="/admin/students">취소</a>
            <button class="button button-primary" type="submit" data-student-submit th:text="${student != null} ? '수정 완료' : '학생 등록'">학생 등록</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
