<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>프로젝트 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
  <h3 th:text="${projectId != null} ? '프로젝트 수정' : '새 프로젝트 등록'">프로젝트 등록</h3>

  <form th:action="@{${formAction}}" method="post">

    <div class="mb-3">
      <label class="form-label">제목</label>
      <input type="text" name="title" class="form-control" th:value="${project != null} ? ${project.title} : ''" required>
    </div>

    <div class="mb-3">
      <label class="form-label">설명</label>
      <textarea name="description" class="form-control" rows="3" required th:text="${project != null} ? ${project.description} : ''"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">YouTube URL</label>
      <input type="text" name="youtubeUrl" class="form-control" th:value="${project != null} ? ${project.youtubeEmbedUrl} : ''" required>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label class="form-label">GitHub URL</label>
        <input type="text" name="githubUrl" class="form-control" th:value="${project != null} ? ${project.githubUrl} : ''">
      </div>
      <div class="col">
        <label class="form-label">개발일지 URL</label>
        <input type="text" name="devlogUrl" class="form-control" th:value="${project != null} ? ${project.devlogUrl} : ''">
      </div>
      <div class="col">
        <label class="form-label">Live Demo URL</label>
        <input type="text" name="liveUrl" class="form-control" th:value="${project != null} ? ${project.liveUrl} : ''">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">연도</label>
      <input type="number" name="year" class="form-control" th:value="${project != null} ? ${project.year} : ''" required>
    </div>

    <div class="mb-3">
      <label class="form-label">참여 학생</label>
      <div class="form-check" th:each="student : ${allStudents}">
        <input class="form-check-input" type="checkbox" name="studentIds" th:value="${student.id}"
               th:id="'student-' + ${student.id}"
               th:checked="${project != null and #lists.contains(project.studentIds, student.id)}">
        <label class="form-check-label" th:for="'student-' + ${student.id}" th:text="${student.name}"></label>
      </div>
    </div>

    <!-- Technology autocomplete widget goes here (from the previous message) -->
    <div class="mb-3">
      <label class="form-label">기술 스택</label>
      <input type="text" id="techSearchInput" class="form-control" placeholder="기술 이름 입력 (예: gpt)" autocomplete="off">
      <div id="techSuggestions" class="list-group position-absolute" style="z-index:10;"></div>
      <div id="techChips" class="mt-2"></div>
      <div class="mt-2 d-none" id="newTechRow">
        <div class="input-group">
          <input type="text" id="newTechName" class="form-control" placeholder="새 기술 이름">
          <select id="newTechCategory" class="form-select">
            <option value="FRAMEWORK">FRAMEWORK</option>
            <option value="LANGUAGE">LANGUAGE</option>
            <option value="DATABASE">DATABASE</option>
            <option value="CLOUD">CLOUD</option>
            <option value="WEB_SERVER">WEB_SERVER</option>
            <option value="PROTOCOL">PROTOCOL</option>
            <option value="AUTH">AUTH</option>
            <option value="AI">AI</option>
            <option value="EXTERNAL_API">EXTERNAL_API</option>
            <option value="ETC">ETC</option>
          </select>
          <button type="button" class="btn btn-dark" onclick="createNewTech()">추가</button>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-dark">저장</button>
  </form>
</div>

<script th:inline="javascript">
  const selectedTech = new Map();
  /*[# th:if="${project != null}"]*/
  const existing = /*[[${project.technologies}]]*/ [];
  existing.forEach(t => selectedTech.set(t.id, t.name));
  /*[/]*/
  renderChips();

  document.getElementById('techSearchInput').addEventListener('input', async function () {
    const q = this.value.trim();
    const box = document.getElementById('techSuggestions');
    const newRow = document.getElementById('newTechRow');
    if (q.length < 1) { box.innerHTML = ''; newRow.classList.add('d-none'); return; }

    const res = await fetch(`/admin/api/technologies/search?q=${encodeURIComponent(q)}`);
    const results = await res.json();

    box.innerHTML = results.map(t =>
            `<button type="button" class="list-group-item list-group-item-action" onclick="pickTech(${t.id}, '${t.name}')">${t.name}</button>`
    ).join('');

    newRow.classList.toggle('d-none', results.some(t => t.name.toLowerCase() === q.toLowerCase()));
    document.getElementById('newTechName').value = q;
  });

  function pickTech(id, name) {
    selectedTech.set(id, name);
    renderChips();
    document.getElementById('techSearchInput').value = '';
    document.getElementById('techSuggestions').innerHTML = '';
    document.getElementById('newTechRow').classList.add('d-none');
  }

  async function createNewTech() {
    const name = document.getElementById('newTechName').value.trim();
    const category = document.getElementById('newTechCategory').value;
    if (!name) return;

    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    const res = await fetch('/admin/api/technologies', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        [csrfHeader]: csrfToken
      },
      body: JSON.stringify({ name, category })
    });

    if (!res.ok) {
      console.error('Failed to create technology:', res.status);
      return;
    }

    const created = await res.json();
    pickTech(created.id, created.name);
  }

  function removeTech(id) {
    selectedTech.delete(id);
    renderChips();
  }

  function renderChips() {
    const container = document.getElementById('techChips');
    container.innerHTML = Array.from(selectedTech.entries()).map(([id, name]) => `
        <span class="badge bg-secondary me-1">
            ${name}
            <input type="hidden" name="technologyIds" value="${id}">
            <a href="#" onclick="removeTech(${id}); return false;" class="text-white ms-1">&times;</a>
        </span>
    `).join('');
  }
</script>

</body>
</html>
