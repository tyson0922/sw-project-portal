<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>관리자 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">관리자 대시보드</span>
  <form th:action="@{/logout}" method="post" class="d-flex">
    <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
  </form>
</nav>

<div class="container py-4">
  <p class="mb-4" sec:authentication="name">로그인한 관리자 이름</p>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">프로젝트 관리</h5>
          <p class="card-text text-muted">졸업작품 등록 · 수정 · 삭제</p>
          <a href="#" class="btn btn-dark btn-sm">준비 중</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">학생 관리</h5>
          <p class="card-text text-muted">학생 정보 등록 · 수정 · 삭제</p>
          <a href="#" class="btn btn-dark btn-sm">준비 중</a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
