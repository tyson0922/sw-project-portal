<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-render-mode="static"
      th:attr="data-render-mode='server'">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 | SW 작품전</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
  </head>
  <body class="admin-page" data-page="admin-dashboard" id="top">
    <header class="admin-topbar">
      <div class="container admin-topbar-inner">
        <a class="brand" href="/"><span class="brand-mark">SW</span><span>작품전 관리자</span></a>
        <div class="admin-topbar-actions">
          <a href="/">전시 페이지</a>
          <form action="/logout" th:action="@{/logout}" method="post">
            <button class="admin-logout-button" type="submit">로그아웃</button>
          </form>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="container admin-shell">
        <section class="admin-page-heading">
          <div>
            <span class="section-kicker">ADMIN DASHBOARD</span>
            <h1>작품전 관리</h1>
          </div>
          <p><strong sec:authentication="name">관리자</strong> 계정으로 로그인했습니다.<br>프로젝트와 참여 학생 정보를 관리할 수 있습니다.</p>
        </section>

        <section class="admin-dashboard-grid">
          <article class="admin-feature-card">
            <span class="admin-card-index">01</span>
            <div>
              <span class="section-kicker">PROJECTS</span>
              <h2>프로젝트 관리</h2>
              <p>프로젝트 등록, 정보 수정, 기술·학생 연결과 삭제 작업을 수행합니다.</p>
            </div>
            <a class="button button-primary" href="/admin/projects">프로젝트 관리 <span aria-hidden="true">→</span></a>
          </article>
          <article class="admin-feature-card">
            <span class="admin-card-index">02</span>
            <div>
              <span class="section-kicker">STUDENTS</span>
              <h2>학생 관리</h2>
              <p>프로젝트에 연결할 학생의 이름과 소속 기수 정보를 관리합니다.</p>
            </div>
            <a class="button button-primary" href="/admin/students">학생 관리 <span aria-hidden="true">→</span></a>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
