<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-render-mode="static"
      th:attr="data-render-mode='server'">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | SW 작품전</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
  </head>
  <body class="admin-auth-page" data-page="admin-login">
    <main class="admin-auth-shell">
      <section class="admin-login-card">
        <a class="brand admin-auth-brand" href="/"><span class="brand-mark">SW</span><span>SW 작품전</span></a>
        <span class="section-kicker">ADMIN ACCESS</span>
        <h1>관리자 로그인</h1>
        <p>작품과 참여 학생을 관리하려면 관리자 계정으로 로그인하세요.</p>

        <div class="admin-alert admin-alert-error" data-server-only th:if="${param.error}" role="alert">
          아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div class="admin-alert admin-alert-success" data-server-only th:if="${param.logout}" role="status">
          로그아웃되었습니다.
        </div>

        <form class="admin-login-form" action="/admin/login" th:action="@{/admin/login}" method="post">
          <div class="admin-field">
            <label for="username">아이디</label>
            <input class="form-control" id="username" name="username" type="text" required autofocus autocomplete="username">
          </div>
          <div class="admin-field">
            <label for="password">비밀번호</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="button button-primary admin-login-submit" type="submit">로그인</button>
        </form>

        <a class="admin-back-link" href="/">← 작품전으로 돌아가기</a>
      </section>
      <aside class="admin-auth-art" aria-hidden="true">
        <span>2026</span>
        <strong>Administrator<br>Page</strong>
        <p>Korea Polytechnics Seoul Gangseo Campus</p>
      </aside>
    </main>
  </body>
</html>
