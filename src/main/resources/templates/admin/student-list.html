<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-render-mode="static"
      th:attr="data-render-mode='server'">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 관리 | SW 작품전</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
  </head>
  <body class="admin-page" data-page="student-list" id="top">
    <header class="admin-topbar">
      <div class="container admin-topbar-inner">
        <a class="brand" href="/admin/dashboard"><span class="brand-mark">SW</span><span>작품전 관리자</span></a>
        <a class="admin-dashboard-link" href="/admin/dashboard">대시보드로 돌아가기</a>
      </div>
    </header>

    <main class="admin-main">
      <div class="container admin-shell">
        <section class="admin-page-heading admin-list-heading">
          <div>
            <span class="section-kicker">STUDENT MANAGEMENT</span>
            <h1>학생 관리</h1>
          </div>
          <a class="button button-primary" href="/admin/students/new">새 학생 등록 <span aria-hidden="true">＋</span></a>
        </section>

        <section class="admin-table-card">
          <div class="admin-table-header">
            <strong>등록 학생</strong>
            <span data-server-only th:text="${students.size() + ' STUDENTS'}"></span>
          </div>
          <div class="table-responsive">
            <table class="table admin-table align-middle">
              <thead><tr><th>학생 이름</th><th><span class="visually-hidden">관리</span></th></tr></thead>
              <tbody>
                <tr data-server-only th:each="student : ${students}">
                  <td><strong th:text="${student.name}"></strong></td>
                  <td>
                    <div class="admin-row-actions">
                      <a class="admin-action-button" th:href="@{'/admin/students/' + ${student.id} + '/edit'}">수정</a>
                      <form th:action="@{'/admin/students/' + ${student.id} + '/delete'}" method="post">
                        <button class="admin-action-button danger" type="submit" onclick="return confirm('학생을 삭제하시겠습니까?')">삭제</button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="admin-empty" data-server-only th:if="${students.isEmpty()}">등록된 학생이 없습니다.</div>
        </section>
      </div>
    </main>
  </body>
</html>
