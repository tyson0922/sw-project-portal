<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>학생 관리</h3>
        <a th:href="@{/admin/students/new}" class="btn btn-dark">새 학생 등록</a>
    </div>

    <table class="table">
        <thead><tr><th>이름</th><th></th></tr></thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}"></td>
            <td>
                <a th:href="@{'/admin/students/' + ${student.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">수정</a>
                <form th:action="@{'/admin/students/' + ${student.id} + '/delete'}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
