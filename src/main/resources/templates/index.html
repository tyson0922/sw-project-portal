<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SW 작품전</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 mb-4 d-flex justify-content-between">
    <span class="navbar-brand mb-0 h1">SW 작품전</span>
    <a sec:authorize="isAuthenticated()" th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm">관리자 대시보드</a>
    <a sec:authorize="isAnonymous()" th:href="@{/admin/login}" class="btn btn-outline-light btn-sm">관리자 로그인</a>
</nav>


<div class="container">

    <form method="get" class="mb-4">
        <div class="row g-2 align-items-end mb-2">
            <div class="col-auto">
                <label class="form-label">연도</label>
                <select name="year" class="form-select">
                    <option value="">전체</option>
                    <option value="2026" th:selected="${selectedYear} == 2026">2026</option>
                    <option value="2025" th:selected="${selectedYear} == 2025">2025</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label">학생 이름</label>
                <input type="text" name="studentName" class="form-control" th:value="${selectedStudentName}" placeholder="이름 검색">
            </div>
<!--            <div class="col-auto form-check mb-2">-->
<!--                <input type="checkbox" name="usesAi" value="true" class="form-check-input" th:checked="${selectedUsesAi}">-->
<!--                <label class="form-check-label">AI 사용 프로젝트만</label>-->
<!--            </div>-->
            <div class="col-auto">
                <button type="submit" class="btn btn-dark">검색</button>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#advancedSearch">
                    상세검색
                </button>
            </div>
        </div>

        <div class="collapse" id="advancedSearch">
            <div class="card card-body">
                <div class="row mb-2" th:each="entry : ${technologiesByCategory}">
                    <div class="col-2 fw-bold" th:text="${entry.key}">카테고리</div>
                    <div class="col-10">
                        <div class="form-check form-check-inline" th:each="opt : ${entry.value}">
                            <input class="form-check-input" type="checkbox" name="technologyIds"
                                   th:value="${opt.id}" th:id="'tech-' + ${opt.id}"
                                   th:checked="${selectedTechnologyIds != null and #lists.contains(selectedTechnologyIds, opt.id)}">
                            <label class="form-check-label" th:for="'tech-' + ${opt.id}" th:text="${opt.name}"></label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-4" th:each="project : ${projectPage.content}">
            <div class="card h-100">
                <img th:src="${project.thumbnailUrl}" class="card-img-top" alt="thumbnail">
                <div class="card-body">
                    <span th:if="${project.usesAi}" class="badge bg-info mb-2">AI</span>
                    <h5 class="card-title" th:text="${project.title}">제목</h5>
                    <p class="text-muted mb-2" th:text="${#strings.listJoin(project.studentNames, ', ')}">학생</p>
                    <div class="mb-2">
                        <span th:each="tech : ${project.technologyNames}" class="badge bg-secondary me-1" th:text="${tech}">tech</span>
                    </div>
                    <a th:href="@{'/project/' + ${project.id}}" class="btn btn-dark btn-sm">자세히 보기</a>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${projectPage.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, projectPage.totalPages - 1)}"
                th:classappend="${i == projectPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/(page=${i}, year=${selectedYear}, studentName=${selectedStudentName}, usesAi=${selectedUsesAi}, technologyIds=${selectedTechnologyIds})}"
                   th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
