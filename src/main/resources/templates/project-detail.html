<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-render-mode="static"
      th:attr="data-render-mode='server'">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.title + ' | SW 작품전'}">프로젝트 상세 | SW 작품전</title>
    <meta name="description" content="SW 작품전 프로젝트 상세 정보와 기술 스택을 확인하세요.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/common.js" defer></script>
    <script src="/js/detail.js" defer></script>
  </head>
  <body data-page="detail" id="top">
    <div data-site-header
         data-admin-authenticated="false"
         th:attr="data-admin-authenticated=${#authorization.expression('isAuthenticated()')}"></div>
    <main class="detail-main">
      <div class="container" data-detail-root>
        <nav class="breadcrumb" aria-label="경로">
          <a href="/" data-history-back>← <span>목록으로</span></a>
          <span>Portfolio</span><i>/</i><strong th:text="${project.title}"></strong>
        </nav>

        <section class="detail-hero">
          <div class="detail-copy">
            <div class="detail-badges">
              <span th:text="${project.usesAi} ? 'AI · 웹' : '웹'"></span>
              <span class="outline">SOFTWARE PROJECT</span>
            </div>
            <p class="detail-year" th:text="${project.year + ' SOFTWARE EXHIBITION'}"></p>
            <h1 th:text="${project.title}"></h1>
            <p class="detail-summary" th:text="${project.description}"></p>
            <div class="team-line">
              <span>CREATED BY</span>
              <strong th:text="${#strings.listJoin(project.studentNames, ', ')}"></strong>
            </div>
          </div>
        </section>

        <section class="video-section" th:if="${project.youtubeEmbedUrl != null}">
          <div class="section-row">
            <div>
              <span class="section-kicker">PROJECT FILM</span>
              <h2>프로젝트를<br>영상으로 만나보세요.</h2>
            </div>
            <span class="section-index">01</span>
          </div>
          <div class="video-frame ratio ratio-16x9">
            <iframe
              th:src="${project.youtubeEmbedUrl}"
              th:title="${project.title + ' 작품 소개 영상'}"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
        </section>

        <section class="detail-content-grid row">
          <div class="col-12">
            <aside class="stack-card card h-100">
              <span class="section-kicker">TECH STACK</span>
              <div class="stack-groups">
                <div class="stack-group"
                     data-server-only
                     th:each="entry : ${project.technologiesByCategory}">
                  <h3 data-category-label th:attr="data-category=${entry.key}" th:text="${entry.key}"></h3>
                  <div class="tech-badges">
                    <span tabindex="0" th:each="name : ${entry.value}" th:text="${name}"></span>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </section>

        <section class="links-section">
          <span class="section-kicker">EXPLORE MORE</span>
          <h2>프로젝트 더 알아보기</h2>
          <div class="external-links row g-3">
            <a class="col-12 col-lg external-link"
               th:if="${project.githubUrl != null and !project.githubUrl.isEmpty()}"
               th:href="${project.githubUrl}"
               target="_blank"
               rel="noopener noreferrer">
              <b>⌘</b><span><small>SOURCE CODE</small>GitHub Repository</span><i>→</i>
            </a>
            <a class="col-12 col-lg external-link"
               th:if="${project.liveUrl != null and !project.liveUrl.isEmpty()}"
               th:href="${project.liveUrl}"
               target="_blank"
               rel="noopener noreferrer">
              <b>↗</b><span><small>LIVE SERVICE</small>서비스 방문하기</span><i>→</i>
            </a>
            <a class="col-12 col-lg external-link"
               th:if="${project.devlogUrl != null and !project.devlogUrl.isEmpty()}"
               th:href="${project.devlogUrl}"
               target="_blank"
               rel="noopener noreferrer">
              <b>▤</b><span><small>DEV STORY</small>개발 기록 읽기</span><i>→</i>
            </a>
            <p class="empty-links col-12"
               data-server-only
               th:if="${(project.githubUrl == null or project.githubUrl.isEmpty()) and (project.liveUrl == null or project.liveUrl.isEmpty()) and (project.devlogUrl == null or project.devlogUrl.isEmpty())}"
               role="status">등록된 링크가 없습니다</p>
          </div>
        </section>
      </div>
    </main>
    <div data-site-footer></div>
  </body>
</html>
