<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.title}">프로젝트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <a href="/" class="d-inline-block mb-3">&larr; 목록</a>

    <div class="ratio ratio-16x9 mb-4">
        <iframe th:src="${project.youtubeEmbedUrl}" allowfullscreen></iframe>
    </div>

    <span th:if="${project.usesAi}" class="badge bg-info mb-2">AI</span>
    <h2 th:text="${project.title}">제목</h2>
    <p class="text-muted" th:text="${#strings.listJoin(project.studentNames, ', ')}">학생</p>
    <p th:text="${project.description}">설명</p>

    <div class="mt-4">
        <div class="row mb-2" th:each="entry : ${project.technologiesByCategory}">
            <div class="col-2 fw-bold" th:text="${entry.key}">카테고리</div>
            <div class="col-10">
                <span th:each="name : ${entry.value}" class="badge bg-secondary me-1" th:text="${name}">tech</span>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:if="${project.githubUrl != null and !project.githubUrl.isEmpty()}"
           th:href="${project.githubUrl}" class="btn btn-dark btn-sm me-2">GitHub</a>
        <a th:if="${project.devlogUrl != null and !project.devlogUrl.isEmpty()}"
           th:href="${project.devlogUrl}" class="btn btn-outline-secondary btn-sm me-2">개발일지</a>
        <a th:if="${project.liveUrl != null and !project.liveUrl.isEmpty()}"
           th:href="${project.liveUrl}" class="btn btn-outline-primary btn-sm">Live Demo</a>
    </div>
</div>

</body>
</html>
